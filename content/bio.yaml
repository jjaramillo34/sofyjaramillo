portraitAlt_en: "Portrait of Sofy"
portraitAlt_es: "Retrato de Sofy"
bio_en: "I was born in Ecuador, between volcanoes and very blue skies. I started painting when I was little, and at twelve I saw The Starry Night for the first time — I couldn't stop looking at how the sky moved.\n\nSince then I paint with thick, curving brushstrokes and colors that feel alive: night blues, sunflower yellows and the warm ochres of the Andes. I also paint sneakers and denim jackets, because art should go out into the street too.\n\nEvery piece is made by hand, and every commission is a conversation."
bio_es: "Nací en Ecuador, entre volcanes y cielos muy azules. Empecé a pintar desde pequeña y a los doce años vi La noche estrellada por primera vez — no podía dejar de mirar cómo se movía el cielo.\n\nDesde entonces pinto con pinceladas gruesas y curvas, y con colores que se sienten vivos: azules de noche, amarillos de girasol y los ocres cálidos de los Andes. También pinto zapatos y chaquetas de jean, porque el arte también tiene que salir a la calle.\n\nCada obra está hecha a mano, y cada pedido es una conversación."
