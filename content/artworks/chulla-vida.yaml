description_en: "A love letter to Ecuadorian slang: “Chulla vida, ñaño”, “¿En qué bus vas vos, ve?”, “Aquisito nomás es”, “No sea malito, veci”. A rainbow paintbrush and a red macaw bring it to life."
description_es: "Una carta de amor a las expresiones ecuatorianas: “Chulla vida, ñaño”, “¿En qué bus vas vos, ve?”, “Aquisito nomás es”, “No sea malito, veci”. Un pincel arcoíris y una guacamaya roja le dan vida."
