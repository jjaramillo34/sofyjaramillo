alt_en: "A rainbow paintbrush curving into a C, a red macaw and a red flower on a stained cream background, with hand-lettered Ecuadorian phrases."
alt_es: "Un pincel arcoíris que se curva en forma de C, una guacamaya roja y una flor roja sobre un fondo crema manchado, con frases ecuatorianas escritas a mano."
